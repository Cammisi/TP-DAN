networks:
  tp-nube-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  kafka-data:

services:

  # ------------------------------------------------------------------
  # Infraestructura de datos y mensajería
  # ------------------------------------------------------------------

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: fan_identity_db
      POSTGRES_USER: fan_admin
      POSTGRES_PASSWORD: fan_pass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fan_admin -d fan_identity_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tp-nube-network

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # timeout en 10s, no 5s: mongosh levanta su propio proceso Node.js en cada
      # chequeo (no es la query lo lento), y eso solo puede tardar 2-4s largos
      # con la máquina cargada — mismo problema que tuvo el healthcheck de kafka.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - tp-nube-network

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      # timeout en 12s: el propio script del healthcheck levanta una JVM cliente para
      # consultar el broker, y eso solo (sin contar el resto del stack) ya tarda ~7s.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 12s
      retries: 8
      start_period: 20s
    networks:
      - tp-nube-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tp-nube-deportes
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tp-nube-network

  # ------------------------------------------------------------------
  # Infraestructura Spring Cloud
  # ------------------------------------------------------------------

  eureka-server:
    build:
      context: ./backend-app/infrastructure/eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
      EUREKA_CLIENT_REGISTERWITHEUREKA: "false"
      EUREKA_CLIENT_FETCHREGISTRY: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - tp-nube-network

  cloud-gateway:
    build:
      context: ./backend-app/infrastructure/cloud-gateway
    container_name: cloud-gateway
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      JWT_SECRET: "${JWT_SECRET:?Falta JWT_SECRET, copiá .env.example a .env}"
    depends_on:
      eureka-server:
        condition: service_healthy
      fan-identity-service:
        condition: service_healthy
      match-ingestion-service:
        condition: service_healthy
      alert-dispatcher-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - tp-nube-network

  # ------------------------------------------------------------------
  # Microservicios de negocio
  # ------------------------------------------------------------------

  fan-identity-service:
    build:
      context: ./backend-app/microservices/fan-identity-service
    container_name: fan-identity-service
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fan_identity_db
      SPRING_DATASOURCE_USERNAME: fan_admin
      SPRING_DATASOURCE_PASSWORD: fan_pass123
      SPRING_JPA_HIBERNATE_DDLAUTO: update
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      JWT_SECRET: "${JWT_SECRET:?Falta JWT_SECRET, copiá .env.example a .env}"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY, copiá .env.example a .env}"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - tp-nube-network

  match-ingestion-service:
    build:
      context: ./backend-app/microservices/match-ingestion-service
    container_name: match-ingestion-service
    environment:
      SERVER_PORT: 8082
      # SPRING_MONGODB_URI, no SPRING_DATA_MONGODB_URI: en Boot 4 la property vieja
      # quedó deprecada y ya no se bindea (R-8, ver CLAUDE.md).
      SPRING_MONGODB_URI: mongodb://mongo:27017/match_ingestion_db
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - tp-nube-network

  alert-dispatcher-service:
    build:
      context: ./backend-app/microservices/alert-dispatcher-service
    container_name: alert-dispatcher-service
    environment:
      SERVER_PORT: 8083
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:19092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFERIPADDRESS: "true"
      INTERNAL_API_KEY: "${INTERNAL_API_KEY:?Falta INTERNAL_API_KEY, copiá .env.example a .env}"
    depends_on:
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - tp-nube-network

  # ------------------------------------------------------------------
  # Frontend
  # ------------------------------------------------------------------

  frontend-app:
    build:
      context: ./frontend-app
      args:
        # ver explicacion_docker_compose.md: build arg y localhost a propósito
        NEXT_PUBLIC_GATEWAY_URL: http://localhost:8080
    container_name: frontend-app
    ports:
      - "3000:3000"
    depends_on:
      cloud-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - tp-nube-network

  # ------------------------------------------------------------------
  # Observabilidad y Telemetría (T-50)
  # ------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      cloud-gateway:
        condition: service_healthy
      fan-identity-service:
        condition: service_healthy
      match-ingestion-service:
        condition: service_healthy
      alert-dispatcher-service:
        condition: service_healthy
    networks:
      - tp-nube-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infrastructure/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - tp-nube-network

  # ------------------------------------------------------------------
  # Almacén centralizado de logs (T-51)
  # ------------------------------------------------------------------

  loki:
    image: grafana/loki:3.1.0
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - tp-nube-network

  promtail:
    image: grafana/promtail:3.1.0
    container_name: promtail
    volumes:
      - ./infrastructure/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - tp-nube-network
