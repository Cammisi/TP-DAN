server:
  port: 8080

spring:
  application:
    name: cloud-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: fan-identity-service
              uri: lb://FAN-IDENTITY-SERVICE
              predicates:
                - Path=/api/fans/**
            - id: fan-identity-catalog
              uri: lb://FAN-IDENTITY-SERVICE
              predicates:
                - Path=/api/catalog/**
            - id: match-ingestion-service
              uri: lb://MATCH-INGESTION-SERVICE
              predicates:
                - Path=/api/matches/**
            - id: alert-dispatcher-service
              uri: lb://ALERT-DISPATCHER-SERVICE
              predicates:
                - Path=/api/alerts/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,gateway
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

jwt:
  secret: default-dev-secret-key-que-tiene-al-menos-256-bits-para-hs256 # tiene que coincidir con el de fan-identity

cors:
  allowed-origins: http://localhost:3000
