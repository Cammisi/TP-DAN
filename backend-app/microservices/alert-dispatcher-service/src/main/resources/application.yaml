server:
  port: 8083

spring:
  application:
    name: alert-dispatcher-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: alert-dispatcher-service
      auto-offset-reset: earliest # para no perder eventos publicados antes de que este servicio estuviera arriba
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.tpnube.alert_dispatcher_service.dto.MatchEventDTO
        spring.json.use.type.headers: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

feign:
  client:
    config:
      fan-identity-service:
        connect-timeout: 1000
        read-timeout: 3000 # el callback de notificación no pasa por el Circuit Breaker (ver CLAUDE.md)

topics:
  match-events: match-events
